version: "3.9"

# ============================================================
# VAYORA — Docker Compose (Development)
# ============================================================

services:

  # ----------------------------------------------------------
  # PostgreSQL + PostGIS
  # ----------------------------------------------------------
  postgres:
    image: postgis/postgis:16-3.4
    container_name: vayora-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vayora}
      POSTGRES_USER: ${POSTGRES_USER:-vayora_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vayora_user} -d ${POSTGRES_DB:-vayora}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - vayora-network

  # ----------------------------------------------------------
  # Redis
  # ----------------------------------------------------------
  redis:
    image: redis:7.2-alpine
    container_name: vayora-redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --appendonly yes
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - vayora-network

  # ----------------------------------------------------------
  # OSRM (Open Source Routing Machine)
  # Using a pre-built demo image for development.
  # Production: mount processed map data.
  # ----------------------------------------------------------
  osrm:
    image: osrm/osrm-backend:latest
    container_name: vayora-osrm
    restart: unless-stopped
    ports:
      - "${OSRM_PORT:-5000}:5000"
    command: >
      osrm-routed --algorithm mld /data/map.osrm
    volumes:
      - ./database/osrm:/data
    networks:
      - vayora-network
    profiles:
      - full
    # NOTE: OSRM requires pre-processed map data.
    # See docs/deployment.md for OSRM setup instructions.
    # In development without map data, the Spring Boot service
    # falls back to Haversine estimation gracefully.

  # ----------------------------------------------------------
  # Spring Boot Backend
  # ----------------------------------------------------------
  backend:
    build:
      context: ./backend/spring-boot
      dockerfile: Dockerfile
    container_name: vayora-backend
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-docker}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-vayora}
      POSTGRES_USER: ${POSTGRES_USER:-vayora_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ACCESS_EXPIRY_MS: ${JWT_ACCESS_EXPIRY_MS:-900000}
      JWT_REFRESH_EXPIRY_MS: ${JWT_REFRESH_EXPIRY_MS:-604800000}
      OSRM_BASE_URL: http://osrm:5000
      AI_SERVICE_URL: http://ai-service:8000
      REALTIME_SERVICE_URL: http://realtime-gateway:3001
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
    ports:
      - "${SPRING_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - vayora-network

  # ----------------------------------------------------------
  # FastAPI AI Service
  # ----------------------------------------------------------
  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: vayora-ai-service
    restart: unless-stopped
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-vayora}
      POSTGRES_USER: ${POSTGRES_USER:-vayora_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      AI_LOG_LEVEL: ${AI_LOG_LEVEL:-info}
      SIMULATION_SEED: ${SIMULATION_SEED:-42}
      SIMULATION_ENABLED: ${SIMULATION_ENABLED:-true}
    ports:
      - "${AI_SERVICE_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - vayora-network

  # ----------------------------------------------------------
  # Node.js Realtime Gateway (Socket.IO)
  # ----------------------------------------------------------
  realtime-gateway:
    build:
      context: ./realtime-gateway
      dockerfile: Dockerfile
    container_name: vayora-realtime
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      REALTIME_PORT: 3001
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      SPRING_BACKEND_URL: http://backend:8080
      CORS_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
    ports:
      - "${REALTIME_PORT:-3001}:3001"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3001/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    networks:
      - vayora-network

  # ----------------------------------------------------------
  # React Frontend (Development)
  # ----------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development
    container_name: vayora-frontend
    restart: unless-stopped
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080}
      VITE_AI_BASE_URL: ${VITE_AI_BASE_URL:-http://localhost:8000}
      VITE_REALTIME_URL: ${VITE_REALTIME_URL:-http://localhost:3001}
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
      - ai-service
      - realtime-gateway
    networks:
      - vayora-network

# ----------------------------------------------------------
# Volumes
# ----------------------------------------------------------
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

# ----------------------------------------------------------
# Networks
# ----------------------------------------------------------
networks:
  vayora-network:
    driver: bridge
    name: vayora-network
