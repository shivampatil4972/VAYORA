# ============================================================
# VAYORA Spring Boot — application.yml
# ============================================================

spring:
  application:
    name: vayora-api

  # DataSource — values injected via environment variables
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:vayora}?stringtype=unspecified
    username: ${POSTGRES_USER:vayora_user}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  # JPA / Hibernate
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        default_schema: public

  # Flyway migrations
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  # Redis
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2

  # Security — CORS
  mvc:
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Server
server:
  port: ${SPRING_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

# JWT — values MUST be injected via environment variables
vayora:
  jwt:
    secret: ${JWT_SECRET}
    access-token-expiry-ms: ${JWT_ACCESS_EXPIRY_MS:900000}
    refresh-token-expiry-ms: ${JWT_REFRESH_EXPIRY_MS:604800000}

  # External services
  services:
    osrm-base-url: ${OSRM_BASE_URL:http://localhost:5000}
    ai-service-url: ${AI_SERVICE_URL:http://localhost:8000}
    realtime-service-url: ${REALTIME_SERVICE_URL:http://localhost:3001}

# Logging
logging:
  level:
    root: ${LOG_LEVEL:INFO}
    com.vayora: DEBUG
    org.springframework.security: INFO
    org.hibernate.SQL: INFO
