# ============================================================
# VAYORA Spring Boot — application-test.yml
# Used for unit/integration tests (H2 in-memory DB)
# ============================================================

spring:
  datasource:
    url: jdbc:h2:mem:vayora_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true

  flyway:
    enabled: false

  data:
    redis:
      host: localhost
      port: 6379
      password:

vayora:
  jwt:
    secret: test-secret-key-for-unit-tests-minimum-64-chars-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
    access-token-expiry-ms: 900000
    refresh-token-expiry-ms: 604800000
  services:
    osrm-base-url: http://localhost:5000
    ai-service-url: http://localhost:8000
    realtime-service-url: http://localhost:3001
